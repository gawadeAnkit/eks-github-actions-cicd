name: CI/CD Pipeline - EKS Deployment

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: cloud-api-service
  EKS_CLUSTER_NAME: devops-eks-cluster
  K8S_NAMESPACE: devops-demo

jobs:
  # ========================================================
  # Phase 1: Automated Unit Testing & Code Verification
  # ========================================================
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Execute Automated Test Suite
        run: npm test

  # ========================================================
  # Phase 2: Docker Build, Push to ECR, & Deploy to EKS
  # ========================================================
  build-and-deploy:
    name: Build, Push to ECR & Deploy to EKS
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Docker image: $REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG -t $REGISTRY/$REPOSITORY:latest .
          
          echo "Pushing Docker image to Amazon ECR..."
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:latest
          
          echo "IMAGE_URI=$REGISTRY/$REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Set up Kubeconfig for Amazon EKS
        run: |
          echo "Configuring kubectl context for cluster: ${{ env.EKS_CLUSTER_NAME }}"
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Deploy Manifests to Amazon EKS
        run: |
          echo "Creating namespace if not exists..."
          kubectl apply -f k8s/namespace.yaml
          
          echo "Updating deployment manifest with new image: $IMAGE_URI"
          sed -i "s|<IMAGE_PLACEHOLDER>|$IMAGE_URI|g" k8s/deployment.yaml
          
          echo "Applying Kubernetes manifests..."
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Verify Deployment Rollout Status
        run: |
          echo "Waiting for rollout to complete..."
          kubectl rollout status deployment/cloud-api-deployment -n ${{ env.K8S_NAMESPACE }} --timeout=180s
          
          echo "Deployment successful! Current pods in namespace ${{ env.K8S_NAMESPACE }}:"
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} -o wide
          
          echo "Service Endpoints:"
          kubectl get svc -n ${{ env.K8S_NAMESPACE }}
