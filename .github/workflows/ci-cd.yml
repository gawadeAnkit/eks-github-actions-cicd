name: CI/CD Pipeline - EKS Deployment

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: cloud-api-service
  EKS_CLUSTER_NAME: devops-eks-cluster
  K8S_NAMESPACE: devops-demo

jobs:
  # ========================================================
  # Phase 1: Continuous Integration (Syntax Check + Tests)
  # ========================================================
  test:
    name: Syntax Check & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JavaScript Syntax Validation
        run: |
          node --check src/app.js
          node --check src/server.js

      - name: Execute Automated Unit & Security Tests
        run: npm test

  # ========================================================
  # Phase 2: Docker Build, Security Scan, Push to ECR & Deploy
  # ========================================================
  build-and-deploy:
    name: Build, Scan, Push to ECR & Deploy to EKS
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Multi-Stage Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "IMAGE_URI=$REGISTRY/$REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG -t $REGISTRY/$REPOSITORY:latest .

      - name: Run Trivy Container Vulnerability Scan (DevSecOps)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_URI }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Push Tagged & Latest Images to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:latest

      - name: Configure Kubeconfig for Amazon EKS
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Deploy Hardened Manifests to Amazon EKS
        run: |
          kubectl apply -f k8s/namespace.yaml

          sed -i "s|<IMAGE_PLACEHOLDER>|$IMAGE_URI|g" k8s/deployment.yaml
          sed -i "s|<VERSION_PLACEHOLDER>|$SHORT_SHA|g" k8s/deployment.yaml

          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/pdb.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Verify Deployment Rollout Status
        run: |
          kubectl rollout status deployment/cloud-api-deployment -n ${{ env.K8S_NAMESPACE }} --timeout=180s
          kubectl get pods,svc,hpa,pdb -n ${{ env.K8S_NAMESPACE }} -o wide

      - name: Automatic Rollback on Deployment Failure
        if: failure()
        run: |
          echo "Deployment failed! Rolling back to previous stable revision..."
          kubectl rollout undo deployment/cloud-api-deployment -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/cloud-api-deployment -n ${{ env.K8S_NAMESPACE }} --timeout=120s
